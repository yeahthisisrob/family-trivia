                    type: integer

  /admin/trivia-bank/question:
    delete:
      summary: Admin — delete a trivia bank question
      operationId: adminDeleteTriviaBankQuestion
      tags: [Admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [adminUserId, questionId]
              properties:
                adminUserId:
                  type: string
                questionId:
                  type: string
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean

  /admin/trivia-bank/import:
    post:
      summary: Admin — bulk import trivia questions
      operationId: adminTriviaBankImport
      tags: [Admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [adminUserId, questions]
              properties:
                adminUserId:
                  type: string
                questions:
                  type: array
                  items:
                    type: object
      responses:
        "200":
          description: Import result
          content:
            application/json:
              schema:
                type: object
                properties:
                  imported:
                    type: integer
                  skipped:
                    type: integer

  # ──────────────────────────────────────────────
  # Admin — family feud + system
  # ──────────────────────────────────────────────

  /admin/family-feud:
    get:
      summary: Admin — inspect family feud state
      operationId: adminGetFamilyFeud
      tags: [Admin]
      parameters:
        - { name: adminUserId, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: Feud state for debugging
          content:
            application/json:
              schema:
                type: object
    delete:
      summary: Admin — reset or delete family feud round
      operationId: adminResetFamilyFeud
      tags: [Admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [adminUserId, action]
              properties:
                adminUserId:
                  type: string
                action:
                  type: string
                  enum: [reset-current, delete-round, reset-rotation]
                roundId:
                  type: string
      responses:
        "200":
          description: Action completed
          content:
            application/json:
              schema:
                type: object

  /admin/system-info:
    get:
      summary: Admin — system + environment info
      operationId: adminGetSystemInfo
      tags: [Admin]
      parameters:
        - { name: adminUserId, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: System info (build, env, feature flags)
          content:
            application/json:
              schema:
                type: object

  # ──────────────────────────────────────────────
  # Daily fact variants
  # ──────────────────────────────────────────────

  /daily-fact-categories:
    post:
      summary: Get categories for the daily fact first-person flow
      operationId: getDailyFactCategories
      tags: [Facts]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId]
              properties:
                userId:
                  type: string
      responses:
        "200":
          description: Category list
          content:
            application/json:
              schema:
                type: object
                properties:
                  categories:
                    type: array
                    items:
                      type: string

  /daily-fact-options:
    post:
      summary: Generate question options for the first-person flow
      operationId: getDailyFactOptions
      tags: [Facts]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId]
              properties:
                userId:
                  type: string
                theme:
                  type: string
      responses:
        "200":
          description: Generated options
          content:
            application/json:
              schema:
                type: object
                properties:
                  options:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        question:
                          type: string
                        theme:
                          type: string

components:
  schemas:
    # ──────────────────────────────────────────────
    # Reusable Schemas
    # ──────────────────────────────────────────────

    PlayEligibility:
      type: object
      required: [canPlay, todayET, catchupAvailable]
      description: Result of a play-eligibility check — single source of truth for "can this user play?"
      properties:
        canPlay:
          type: boolean
        reason:
          type: string
          enum: [daily_limit_reached, no_catchup_available, end_of_season]
          description: Why the user cannot play (only present when canPlay is false)
        nextAvailableAt:
          type: string
          format: date-time
          nullable: true
          description: ISO timestamp of when the user can next play
        todayET:
          type: string
          description: "Today's date in Eastern Time (YYYY-MM-DD)"
        catchupAvailable:
          type: integer
          description: Number of catch-up questions available
        lastAnsweredAt:
          type: string
          format: date-time
          nullable: true
          description: "ISO timestamp of the user's most recent answer"

    DifficultyLevel:
      type: string
      enum: [easy, normal, hard]

    GenerateMode:
      type: string
      enum: [personal, history, group, category, custom]

    Question:
      type: object
      required: [question, choices, answer]
      properties:
        question:
          type: string
        choices:
          type: array
          items:
            type: string
        answer:
          type: string
        category:
          type: string
        difficulty:
          $ref: "#/components/schemas/DifficultyLevel"
        pointMultiplier:
          type: number
        mode:
          type: string
        type:
          type: string
        source:
          type: string
        sourceUrl:
          type: string
        externalId:
          type: string

    ProgressMessage:
      type: object
      required: [type, message, timestamp]
      properties:
        type:
          type: string
          enum: [info, warning, success, checking]
        message:
          type: string
        timestamp:
          type: number
        detail:
          type: string
        duration:
          type: number

    HistoryEntry:
      type: object
      required: [question, selectedAnswer, correct, timestamp]
      properties:
        question:
          $ref: "#/components/schemas/Question"
        selectedAnswer:
          type: string
        correct:
          type: boolean
        timestamp:
          type: string
        pointsEarned:
          type: number
        streak:
          type: integer
        isCatchingUp:
          type: boolean
        isCasinoRush:
          type: boolean
        questionNumber:
          type: integer
        totalQuestions:
          type: integer
        reason:
          type: string
        isCustomCategory:
          type: boolean

    FactItem:
      type: object
      required: [id, date, question, answer, fact, timestamp]
      properties:
        id:
          type: string
        date:
          type: string
        question:
          type: string
        answer:
          type: string
        fact:
          type: string
        timestamp:
          type: string
        skipped:
          type: boolean

    UserConfig:
      type: object
      required: [group, color]
      properties:
        group:
          type: string
        color:
          type: string
        side:
          type: string
        passphrase:
          type: string
        isAdmin:
          type: boolean

    Season:
      type: object
      required: [seasonNumber, name, status, startDate]
      properties:
        seasonNumber:
          type: integer
        name:
          type: string
        status:
          type: string
          enum: [active, concluded, upcoming]
        startDate:
          type: string
        endDate:
          type: string
          nullable: true
        message:
          type: string
          nullable: true

    EndOfSeasonStatus:
      type: object
      properties:
        isEndOfSeason:
          type: boolean
        isBetweenSeasons:
          type: boolean
        currentSeason:
          oneOf:
            - $ref: "#/components/schemas/Season"
            - type: object
              nullable: true
        lastSeason:
          oneOf:
            - $ref: "#/components/schemas/Season"
            - type: object
              nullable: true
        personalMessage:
          type: string
          nullable: true
        seasonEndDate:
          type: string
          nullable: true
        nextSeasonStart:
          type: string
          nullable: true

    SystemCategory:
      type: object
      required: [name, description]
      properties:
        name:
          type: string
        description:
          type: string

    CustomCategory:
      type: object
      required: [id, title, description, createdBy, createdAt, type]
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        createdBy:
          type: string
        createdAt:
          type: string
        type:
          type: string
          enum: [custom]

    LeaderboardEntry:
      type: object
      required: [userId, score, streak]
      properties:
        userId:
          type: string
        score:
          type: number
        streak:
          type: integer
        lastAnswer:
          $ref: "#/components/schemas/HistoryEntry"
        categoryScores:
          type: object
        difficultyStats:
          $ref: "#/components/schemas/DifficultyStats"
        avgPointsPerQuestion:
          type: number
        accuracy:
          type: number

    DifficultyStats:
      type: object
      properties:
        easy:
          type: integer
        normal:
          type: integer
        hard:
          type: integer
        total:
          type: integer

    FactComment:
      type: object
      required: [id, userId, text, timestamp]
      properties:
        id:
          type: string
        userId:
          type: string
        text:
          type: string
        timestamp:
          type: string
        parentId:
          type: string

    TriviaComment:
      type: object
      required: [id, userId, text, timestamp]
      properties:
        id:
          type: string
        userId:
          type: string
        text:
          type: string
        timestamp:
          type: string
        parentId:
          type: string

    Birthday:
      type: object
      required: [userId, name, birthday, month, day, daysUntil, isToday]
      properties:
        userId:
          type: string
        name:
          type: string
        birthday:
          type: string
        month:
          type: integer
        day:
          type: integer
        daysUntil:
          type: integer
        isToday:
          type: boolean

    Celebration:
      type: object
      required: [id, type, name, date, addedBy, addedAt, recurring]
      properties:
        id:
          type: string
        type:
          type: string
          enum: [birthday, anniversary, holiday, other]
        name:
          type: string
        date:
          type: string
        description:
          type: string
        addedBy:
          type: string
        addedAt:
          type: string
        recurring:
          type: boolean

    PhotoAlbum:
      type: object
      required: [id, name, url, createdBy, createdAt]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        url:
          type: string
          format: uri
        createdBy:
          type: string
        createdAt:
          type: string
        updatedAt:
          type: string

    SlotMachineResult:
      type: object
      required: [multiplier, category, isPersonalQuestion]
      properties:
        multiplier:
          type: number
        category:
          type: string
        isPersonalQuestion:
          type: boolean
        targetUserName:
          type: string

    CasinoRushSession:
      type: object
      required: [currentQuestion, difficulty, potentialPoints]
      properties:
        currentQuestion:
          type: object
        difficulty:
          $ref: "#/components/schemas/DifficultyLevel"
        potentialPoints:
          type: number
        messages:
          type: array
          items:
            $ref: "#/components/schemas/ProgressMessage"

    MemberSummaryResponse:
      type: object
      required: [userId, summary, mode, lastUpdated]
      properties:
        userId:
          type: string
        summary:
          type: string
        mode:
          type: string
          enum: [regular, roast]
        lastUpdated:
          type: string
        basicQAs:
          type: array
          items:
            $ref: "#/components/schemas/BasicQA"
        insights:
          type: array
          items:
            $ref: "#/components/schemas/MemberInsight"

    BasicQA:
      type: object
      required: [question, answer]
      properties:
        question:
          type: string
        answer:
          type: string

    MemberInsight:
      type: object
      required: [text, category]
      properties:
        text:
          type: string
        category:
          type: string
          enum: [preference, personality, fact, activity, relationship]

    GroupDescription:
      type: object
      required: [groupId, description, updatedBy, updatedAt]
      properties:
        groupId:
          type: string
        description:
          type: string
        updatedBy:
          type: string
        updatedAt:
          type: string

    DailyFactResponse:
      type: object
      required: [question, questionType]
      properties:
        question:
          type: string
        questionType:
          type: string
          enum: [basic, shared]
        questionIndex:
          type: integer
        basicQuestionsTotal:
          type: integer
        basicQuestionsCompleted:
          type: integer

    # ──────────────────────────────────────────────
    # Comments (unified)
    # ──────────────────────────────────────────────

    Comment:
      type: object
      required: [id, userId, text, timestamp]
      properties:
        id:
          type: string
        userId:
          type: string
        text:
          type: string
        timestamp:
          type: string
        parentId:
          type: string

    CommentThread:
      type: object
      required: [contentType, contentId, comments, lastUpdated]
      properties:
        contentType:
          type: string
          enum: [fact, trivia]
        contentId:
          type: string
        comments:
          type: array
          items:
            $ref: "#/components/schemas/Comment"
        lastUpdated:
          type: string

    # ──────────────────────────────────────────────
    # Game modes (shared shapes)
    # ──────────────────────────────────────────────

    GameModeSessionStatus:
      type: object
      required: [hasActiveSession, canPlay]
      properties:
        hasActiveSession:
          type: boolean
        canPlay:
          type: boolean
        nextAvailable:
          type: string
          nullable: true
        session:
          type: object
          description: Active session state — shape varies per mode

    GameModeLockRequest:
      type: object
      required: [userId, multiplier, category]
      properties:
        userId:
          type: string
        multiplier:
          type: integer
        category:
          type: string
        isCatchingUp:
          type: boolean
        difficulty:
          $ref: "#/components/schemas/DifficultyLevel"

    GameModeLockResponse:
      type: object
      required: [question]
      properties:
        question:
          $ref: "#/components/schemas/Question"
        multiplier:
          type: integer
        potentialPoints:
          type: integer

    GameModeAnswerRequest:
      type: object
      required: [userId, question, selectedAnswer]
      properties:
        userId:
          type: string
        question:
          $ref: "#/components/schemas/Question"
        selectedAnswer:
          type: string
        isCatchingUp:
          type: boolean

    GameModeAnswerResponse:
      type: object
      required: [correct, pointsEarned]
      properties:
        correct:
          type: boolean
        pointsEarned:
          type: integer
        multiplier:
          type: integer

    # ──────────────────────────────────────────────
    # Family Feud
    # ──────────────────────────────────────────────

    FamilyFeudGuesser:
      type: object
      required: [userName, submittedAt]
      properties:
        userName:
          type: string
        submittedAt:
          type: string

    FamilyFeudGuess:
      type: object
      required: [userName, guess, correct]
      properties:
        userName:
          type: string
        guess:
          type: string
        correct:
          type: boolean

    FamilyFeudWinner:
      type: object
      required: [userId, userName, points]
      properties:
        userId:
          type: string
        userName:
          type: string
        points:
          type: integer

    FamilyFeudResults:
      type: object
      required: [winners, totalGuesses, revealedAt]
      properties:
        winners:
          type: array
          items:
            $ref: "#/components/schemas/FamilyFeudWinner"
        totalGuesses:
          type: integer
        revealedAt:
          type: string

    FamilyFeudRoundInfo:
      type: object
      required: [roundId, targetUserId, targetUserName, question, status, startedAt, expiresAt, guessCount, guessers]
      properties:
        roundId:
          type: string
        targetUserId:
          type: string
        targetUserName:
          type: string
        question:
          type: string
        status:
          type: string
          enum: [waiting_for_target, active, completed]
        startedAt:
          type: string
        expiresAt:
          type: string
        guessCount:
          type: integer
        guessers:
          type: array
          items:
            $ref: "#/components/schemas/FamilyFeudGuesser"
        myGuess:
          type: string
          nullable: true
        choices:
          type: array
          items:
            type: string
          nullable: true
        realAnswer:
          type: string
          nullable: true
        allGuesses:
          type: array
          items:
            $ref: "#/components/schemas/FamilyFeudGuess"
          nullable: true
        results:
          $ref: "#/components/schemas/FamilyFeudResults"
          nullable: true

    FamilyFeudStatus:
      type: object
      required: [isMyTurn, nextTargetUserId, nextTargetUserName, timesAsTarget, neverGone, totalPeople, recentRounds]
      properties:
        currentRound:
          $ref: "#/components/schemas/FamilyFeudRoundInfo"
          nullable: true
        isMyTurn:
          type: boolean
        nextTargetUserId:
          type: string
        nextTargetUserName:
          type: string
        timesAsTarget:
          type: integer
        neverGone:
          type: integer
        totalPeople:
          type: integer
        recentRounds:
          type: array
          items:
            type: object
