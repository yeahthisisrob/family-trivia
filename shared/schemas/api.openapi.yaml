                    type: string
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean

  /admin/game-sessions:
    get:
      summary: Admin — fetch game mode sessions
      operationId: adminGetGameSessions
