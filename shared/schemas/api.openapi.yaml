                    $ref: "#/components/schemas/PhotoAlbum"
    put:
      summary: Update a photo album (admin only)
      operationId: updatePhotoAlbum
      tags: [PhotoAlbums]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, id]
              properties:
                userId:
                  type: string
                id:
                  type: string
                name:
                  type: string
                description:
                  type: string
                url:
                  type: string
                  format: uri
      responses:
        "200":
          description: Updated album
          content:
            application/json:
              schema:
                type: object
                properties:
                  album:
                    $ref: "#/components/schemas/PhotoAlbum"
    delete:
      summary: Delete a photo album (admin only)
      operationId: deletePhotoAlbum
      tags: [PhotoAlbums]
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: string
        - name: userId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deletion result
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean

  # ──────────────────────────────────────────────
