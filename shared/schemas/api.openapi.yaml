            type: string
      responses:
        "200":
          description: Deletion result
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean

  /admin/family-tree:
    get:
      summary: Get family tree hierarchy
      operationId: getAdminFamilyTree
      tags: [Admin]
      responses:
        "200":
          description: Hierarchy data
          content:
            application/json:
              schema:
                type: object
    put:
      summary: Update family tree hierarchy
      operationId: updateAdminFamilyTree
      tags: [Admin]
      requestBody:
        required: true
        content:
          application/json:
