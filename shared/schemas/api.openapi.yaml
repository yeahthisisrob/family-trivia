                type: object
                properties:
                  albums:
                    type: array
                    items:
                      $ref: "#/components/schemas/PhotoAlbum"
    post:
      summary: Add a photo album (admin only)
      operationId: addPhotoAlbum
      tags: [PhotoAlbums]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, name, url]
              properties:
                userId:
                  type: string
                name:
                  type: string
                description:
                  type: string
                url:
                  type: string
                  format: uri
      responses:
        "200":
          description: Created album
          content:
            application/json:
              schema:
                type: object
                properties:
