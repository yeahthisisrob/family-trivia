openapi: 3.0.3
info:
  title: Family Trivia API
  description: |
    Backend API for the Family Trivia game.

    Every route but POST /auth/google takes a Bearer token and works in one
    circle (docs/decisions/0015): the one named by the X-Circle header, or
    the caller's first circle when it's left out. A caller who isn't in that
    circle gets 403 (errorType NOT_IN_CIRCLE).
  version: 1.0.0

servers:
  - url: http://localhost:3001
    description: Local SAM development

paths:
  # ──────────────────────────────────────────────
  # App Init
  # ──────────────────────────────────────────────

  /app-init:
    get:
      summary: "Critical init: config, hierarchy, season, activation"
      operationId: getAppInit
      tags: [App Init]
      parameters:
        - name: userId
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Critical app data needed for first paint
          content:
            application/json:
              schema:
                type: object
                properties:
                  userConfig:
                    type: object
                  hierarchy:
                    type: object
                  seasonStatus:
                    type: object
                  memberActivation:
                    type: object
                  groupDescriptions:
                    type: object
                  questionAvailability:
                    type: object
                  categories:
                    type: array
                    items:
                      type: object
                  userCategories:
                    type: array
                    items:
                      type: object

  /app-init-deferred:
    get:
      summary: "Deferred init: timeline, catchup, games, feud"
      operationId: getAppInitDeferred
      tags: [App Init]
      parameters:
        - name: userId
          in: query
          required: true
          schema:
            type: string
        - name: side
          in: query
          schema:
            type: string
            default: all
      responses:
        "200":
          description: Deferred data loaded after first paint
          content:
            application/json:
              schema:
                type: object
                properties:
                  timelineData:
                    type: object
                  timelinePagination:
                    type: object
                  familySides:
                    type: object
                  catchupStatus:
                    type: object
                  gameStatuses:
                    type: object
                  familyFeud:
                    type: object

  # ──────────────────────────────────────────────
  # Authentication
  # ──────────────────────────────────────────────

  /members:
    get:
      summary: Get members for a group
      operationId: getMembers
      tags: [Members & Config]
      parameters:
        - name: groupId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of members
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    userId:
                      type: string
                    activated:
                      type: boolean

  /user-config:
    get:
      summary: Get user configuration
      operationId: getUserConfig
      tags: [Members & Config]
      responses:
        "200":
          description: User configuration data
          content:
            application/json:
              schema:
                type: object
                properties:
                  version:
                    type: string
                  lastUpdated:
                    type: string
                  users:
                    type: object
                    additionalProperties:
                      $ref: "#/components/schemas/UserConfig"

  /user-profile:
    get:
      summary: Get user profile
      operationId: getUserProfile
      tags: [Members & Config]
      parameters:
        - name: userId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: User profile object
          content:
            application/json:
              schema:
                type: object

  # ──────────────────────────────────────────────
  # Trivia Questions
  # ──────────────────────────────────────────────

  /generate-question:
    post:
      summary: Generate a trivia question
      operationId: generateQuestion
      tags: [Trivia Questions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, mode]
              properties:
                userId:
                  type: string
                mode:
                  $ref: "#/components/schemas/GenerateMode"
                category:
                  type: string
                difficulty:
                  $ref: "#/components/schemas/DifficultyLevel"
                customPrompt:
                  type: string
                isCatchingUp:
                  type: boolean
                withProgress:
                  type: boolean
      responses:
        "200":
          description: Generated question with optional progress
          content:
            application/json:
              schema:
                type: object
                properties:
                  question:
                    $ref: "#/components/schemas/Question"
                  messages:
                    type: array
                    items:
                      $ref: "#/components/schemas/ProgressMessage"
                  factCheckResult:
                    type: object
                  retriesNeeded:
                    type: integer

  /submit-answer:
    post:
      summary: Submit an answer to a trivia question
      operationId: submitAnswer
      tags: [Trivia Questions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, question, selectedAnswer]
              properties:
                userId:
                  type: string
                groupId:
                  type: string
                question:
                  $ref: "#/components/schemas/Question"
                selectedAnswer:
                  type: string
                isCatchingUp:
                  type: boolean
                isCustomCategory:
                  type: boolean
      responses:
        "200":
          description: Answer result
          content:
            application/json:
              schema:
                type: object
                properties:
                  correct:
                    type: boolean
                  streak:
                    type: integer
                  pointsEarned:
                    type: number
                  multiplier:
                    type: number

  /question-status:
    get:
      summary: Get question timing status
      operationId: getQuestionStatus
      tags: [Trivia Questions]
      parameters:
        - name: userId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Question status
          content:
            application/json:
              schema:
                type: object
                properties:
                  lastQuestionAt:
                    type: string
                    nullable: true
                  nextQuestionAt:
                    type: string

  /can-answer-question:
    get:
      summary: Check if user can answer a question
      operationId: canAnswerQuestion
      tags: [Trivia Questions]
      parameters:
        - name: userId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Answer eligibility
          content:
            application/json:
              schema:
                type: object
                properties:
                  canAnswer:
                    type: boolean
                  nextQuestionAt:
                    type: string
                    format: date-time
                  todayET:
                    type: string
                  lastQuestionAt:
                    type: string
                    format: date-time
                    nullable: true
                  isEndOfSeason:
                    type: boolean
                  catchupAvailable:
                    type: integer
                    description: Number of catch-up questions available

  /catchup-status:
    get:
      summary: Get catch-up status for a user
      operationId: getCatchupStatus
      tags: [Trivia Questions]
      parameters:
        - name: userId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: What's waiting for them in the open season (docs/decisions/0016)
          content:
            application/json:
              schema:
                type: object
                properties:
                  questionsBehind:
                    type: integer
                    description: Trivia waiting, one a day since their first play this season
                  userAnswerCount:
                    type: integer
                  maxQuestionsAvailable:
                    type: integer
                  factsWaiting:
                    type: integer
                    description: Past daily questions this season they haven't answered

  # ──────────────────────────────────────────────
  # Question Generation Steps
  # ──────────────────────────────────────────────

  /question-gen/step1:
    post:
      summary: "Step 1: Generate initial question"
      operationId: questionGenStep1
      tags: [Question Generation Steps]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, mode]
              properties:
                userId:
                  type: string
                mode:
                  $ref: "#/components/schemas/GenerateMode"
                category:
                  type: string
                difficulty:
                  $ref: "#/components/schemas/DifficultyLevel"
      responses:
        "200":
          description: Generated question
          content:
            application/json:
              schema:
                type: object
                properties:
                  question:
                    $ref: "#/components/schemas/Question"
                  messages:
                    type: array
                    items:
                      $ref: "#/components/schemas/ProgressMessage"

  /question-gen/step2:
    post:
      summary: "Step 2: Check for duplicate question"
      operationId: questionGenStep2
      tags: [Question Generation Steps]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Question"
      responses:
        "200":
          description: Duplicate check result
          content:
            application/json:
              schema:
                type: object
                properties:
                  isDuplicate:
                    type: boolean
                  question:
                    $ref: "#/components/schemas/Question"

  /question-gen/step3:
    post:
      summary: "Step 3: Validate question"
      operationId: questionGenStep3
      tags: [Question Generation Steps]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Question"
      responses:
        "200":
          description: Validation result
          content:
            application/json:
              schema:
                type: object
                properties:
                  isValid:
                    type: boolean
                  question:
                    $ref: "#/components/schemas/Question"
                  issues:
                    type: array
                    items:
                      type: string

  # ──────────────────────────────────────────────
  # Daily Facts
  # ──────────────────────────────────────────────

  /daily-fact:
    get:
      summary: Get the daily fact question
      operationId: getDailyFact
      tags: [Daily Facts]
      parameters:
        - name: userId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Daily fact question
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailyFactResponse"
    post:
      summary: Get or generate daily fact question
      operationId: postDailyFact
      tags: [Daily Facts]
      parameters:
        - name: userId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Daily fact question
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailyFactResponse"

  /submit-daily-fact:
    post:
      summary: Submit an answer to a daily fact question
      operationId: submitDailyFact
      tags: [Daily Facts]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, answer]
              properties:
                userId:
                  type: string
                questionIndex:
                  type: integer
                answer:
                  type: string
                date:
                  type: string
      responses:
        "200":
          description: Submission result
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  saved:
                    type: boolean

  /user-fact-history:
    get:
      summary: Get user fact history
      operationId: getUserFactHistory
      tags: [Daily Facts]
      parameters:
        - name: userId
          in: query
          required: true
          schema:
            type: string
        - name: includeGlobal
          in: query
          required: false
          schema:
            type: boolean
      responses:
        "200":
          description: Fact history
          content:
            application/json:
              schema:
                type: object
                properties:
                  facts:
                    type: array
                    items:
                      $ref: "#/components/schemas/FactItem"
                  basicQuestions:
                    type: array
                    items:
                      type: string
                  basicQuestionsTotal:
                    type: integer
                  allSharedQuestions:
                    type: array
                    items:
                      $ref: "#/components/schemas/FactItem"

  /submit-historical-fact:
    post:
      summary: Submit a historical fact answer
      operationId: submitHistoricalFact
      tags: [Daily Facts]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, date, answer]
              properties:
                userId:
                  type: string
                date:
                  type: string
                answer:
                  type: string
      responses:
        "200":
          description: Submission result
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean

  /generate-question-options:
    post:
      summary: Generate question options for daily fact
      operationId: generateQuestionOptions
      tags: [Daily Facts]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId]
              properties:
                userId:
                  type: string
                theme:
                  type: string
                regenerate:
                  type: boolean
      responses:
        "200":
          description: Generated options
          content:
            application/json:
              schema:
                type: object
                properties:
                  options:
                    type: array
                    items:
                      type: object
                      properties:
                        question:
                          type: string
                        theme:
                          type: string
                  weekSummaryContext:
                    type: string

  /recent-shared-questions:
    get:
      summary: Get recent shared questions
      operationId: getRecentSharedQuestions
      tags: [Daily Facts]
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Recent shared questions
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    question:
                      type: string
                    date:
                      type: string

  /daily-fact-summary:
    get:
      summary: Get daily fact summary
      operationId: getDailyFactSummary
      tags: [Daily Facts]
      parameters:
        - name: weekStart
          in: query
          required: false
          schema:
            type: string
        - name: date
          in: query
          required: false
          schema:
            type: string
        - name: forceGenerate
          in: query
          required: false
          schema:
            type: boolean
      responses:
        "200":
          description: Daily fact summary
          content:
            application/json:
              schema:
                type: object

  # ──────────────────────────────────────────────
  # Categories
  # ──────────────────────────────────────────────

  /categories:
    get:
      summary: Get categories for a user
      operationId: getCategories
      tags: [Categories]
      parameters:
        - name: userId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Categories list
          content:
            application/json:
              schema:
                type: object
                properties:
                  systemCategories:
                    type: array
                    items:
                      $ref: "#/components/schemas/SystemCategory"
                  customCategories:
                    type: array
                    items:
                      $ref: "#/components/schemas/CustomCategory"
                  lastCustomCategory:
                    $ref: "#/components/schemas/CustomCategory"

  /create-custom-category:
    post:
      summary: Create a custom category
      operationId: createCustomCategory
      tags: [Categories]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, categoryName]
              properties:
                userId:
                  type: string
                categoryName:
                  type: string
                description:
                  type: string
      responses:
        "200":
          description: Created category
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  category:
                    $ref: "#/components/schemas/CustomCategory"

  /submit-custom-category:
    post:
      summary: Submit a custom category answer
      operationId: submitCustomCategory
      tags: [Categories]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, categoryId, answer]
              properties:
                userId:
                  type: string
                categoryId:
                  type: string
                answer:
                  type: string
      responses:
        "200":
          description: Submission result
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean

  # ──────────────────────────────────────────────
  # Leaderboard
  # ──────────────────────────────────────────────

  /leaderboard:
    get:
      summary: Get leaderboard data
      operationId: getLeaderboard
      tags: [Leaderboard]
      parameters:
        - name: groupId
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Leaderboard data
          content:
            application/json:
              schema:
                type: object

  /consolidated-leaderboard:
    get:
      summary: Get consolidated leaderboard across groups
      operationId: getConsolidatedLeaderboard
      tags: [Leaderboard]
      parameters:
        - name: season
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Consolidated leaderboard
          content:
            application/json:
              schema:
                type: object
                properties:
                  users:
                    type: object
                    additionalProperties:
                      $ref: "#/components/schemas/LeaderboardEntry"
                  groups:
                    type: object
                  userGroups:
                    type: object
                  seasons:
                    type: array
                    items:
                      $ref: "#/components/schemas/Season"
                  selectedSeason:
                    type: string
                  globalCategoryStats:
                    type: object
                    description: "All-time category accuracy stats across all users"
                    additionalProperties:
                      type: object
                      properties:
                        total:
                          type: integer
                          description: "Total answers in this category"
                        correct:
                          type: integer
                          description: "Correct answers in this category"
                      required: [total, correct]
                  success:
                    type: boolean

  # ──────────────────────────────────────────────
  # Season
  # ──────────────────────────────────────────────

  /end-of-season-status:
    get:
      summary: Get end-of-season status
      operationId: getEndOfSeasonStatus
      tags: [Season]
      responses:
        "200":
          description: End of season status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EndOfSeasonStatus"

  # ──────────────────────────────────────────────
  # Family
  # ──────────────────────────────────────────────

  /family-hierarchy:
    get:
      summary: Get family hierarchy
      operationId: getFamilyHierarchy
      tags: [Family]
      responses:
        "200":
          description: Family hierarchy data
          content:
            application/json:
              schema:
                type: object
                properties:
                  hierarchy:
                    type: object
                  groupDescriptions:
                    type: object
                    additionalProperties:
                      type: string
                  familySides:
                    type: object
                    additionalProperties:
                      type: string
                  success:
                    type: boolean

  /group-description:
    get:
      summary: Get group description(s)
      operationId: getGroupDescription
      tags: [Family]
      parameters:
        - name: groupId
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Group description or all descriptions
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/GroupDescription"
                  - type: object
                    properties:
                      descriptions:
                        type: object
                        additionalProperties:
                          $ref: "#/components/schemas/GroupDescription"

  /update-group-description:
    post:
      summary: Update a group description
      operationId: updateGroupDescription
      tags: [Family]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, groupId, description]
              properties:
                userId:
                  type: string
                groupId:
                  type: string
                description:
                  type: string
      responses:
        "200":
          description: Update result
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  groupId:
                    type: string
                  description:
                    type: string

  /suggest-group-description:
    post:
      summary: Get AI-suggested group description
      operationId: suggestGroupDescription
      tags: [Family]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [groupId]
              properties:
                groupId:
                  type: string
                context:
                  type: string
      responses:
        "200":
          description: Suggested description
          content:
            application/json:
              schema:
                type: object
                properties:
                  suggestion:
                    type: string

  /member-summary:
    get:
      summary: Get member summary
      operationId: getMemberSummary
      tags: [Family]
      parameters:
        - name: userId
          in: query
          required: true
          schema:
            type: string
        - name: mode
          in: query
          required: false
          schema:
            type: string
            enum: [regular, roast]
        - name: forceGenerate
          in: query
          required: false
          schema:
            type: boolean
      responses:
        "200":
          description: Member summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberSummaryResponse"

  # ──────────────────────────────────────────────
  # Timeline
  # ──────────────────────────────────────────────

  /timeline-data:
    get:
      summary: Get timeline data
      operationId: getTimelineData
      tags: [Timeline]
      parameters:
        - name: side
          in: query
          required: false
          schema:
            type: string
        - name: userId
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
        - name: before
          in: query
          required: false
          schema:
            type: string
        - name: after
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Timeline data
          content:
            application/json:
              schema:
                type: object

  # ──────────────────────────────────────────────
  # Comments
  # ──────────────────────────────────────────────

  # ──────────────────────────────────────────────
  # Casino Rush
  # ──────────────────────────────────────────────

  /casino-rush/start:
    post:
      summary: Start a Casino Rush session
      operationId: startCasinoRush
      tags: [Casino Rush]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId]
              properties:
                userId:
                  type: string
                difficulty:
                  $ref: "#/components/schemas/DifficultyLevel"
                withProgress:
                  type: boolean
      responses:
        "200":
          description: Casino Rush session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CasinoRushSession"

  /casino-rush/answer:
    post:
      summary: Submit a Casino Rush answer
      operationId: answerCasinoRush
      tags: [Casino Rush]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, questionNumber, answer]
              properties:
                userId:
                  type: string
                questionNumber:
                  type: integer
                answer:
                  type: string
      responses:
        "200":
          description: Casino Rush result
          content:
            application/json:
              schema:
                type: object

  /casino-rush/status:
    get:
      summary: Get Casino Rush status
      operationId: getCasinoRushStatus
      tags: [Casino Rush]
      parameters:
        - name: userId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Casino Rush status
          content:
            application/json:
              schema:
                type: object

  # ──────────────────────────────────────────────
  # Slot Machine
  # ──────────────────────────────────────────────

  /slot-machine/spin:
    post:
      summary: Spin the slot machine
      operationId: slotMachineSpin
      tags: [Slot Machine]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId]
              properties:
                userId:
                  type: string
      responses:
        "200":
          description: Spin result
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    $ref: "#/components/schemas/SlotMachineResult"

  /slot-machine/question:
    post:
      summary: Get question for slot machine result
      operationId: slotMachineQuestion
      tags: [Slot Machine]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId]
              properties:
                userId:
                  type: string
      responses:
        "200":
          description: Question with multiplier
          content:
            application/json:
              schema:
                type: object
                properties:
                  question:
                    $ref: "#/components/schemas/Question"
                  multiplier:
                    type: number

  /slot-machine/answer:
    post:
      summary: Submit slot machine answer
      operationId: slotMachineAnswer
      tags: [Slot Machine]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, answer]
              properties:
                userId:
                  type: string
                answer:
                  type: string
