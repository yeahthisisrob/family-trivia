                          type: string

  # ──────────────────────────────────────────────
  # Family (backend/features/family) — docs/decisions/0009
  # ──────────────────────────────────────────────

  /family:
    get:
      summary: The family — people, ties, households — and short-lived photo URLs
      operationId: getFamily
      tags: [Family]
      responses:
        "200":
          description: The family
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FamilyResponse"

  /admin/family:
    put:
      summary: Replace the family (admins). The version it replaces is kept.
      operationId: saveFamily
      tags: [Family, Admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [family]
              properties:
                family:
                  $ref: "#/components/schemas/Family"
      responses:
        "200":
          description: The saved family
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FamilyResponse"
        "400":
          description: The family has problems (listed in details)
        "403":
          description: Not an admin

  /family/story:
    get:
      summary: The family's story for the top of the Family tab, and a few numbers
      operationId: getFamilyStory
      tags: [Family]
      responses:
        "200":
          description: The story (markdown is null until an admin writes it)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FamilyStory"

  /admin/family/story:
    post:
      summary: Write the family's story again from everyone's latest answers (admins)
      operationId: writeFamilyStory
      tags: [Family, Admin]
      responses:
        "200":
          description: The new story
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FamilyStory"
        "403":
          description: Not an admin
        "503":
          description: The AI model could not write it right now

  /seasons/book/writing:
    post:
      summary: The foreword and chapter openings of a season's book, written once per tone and kept
      operationId: writeSeasonBook
      tags: [Seasons]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookRequest"
      responses:
        "200":
          description: The kept writing, or new writing when asked for fresh (null for just our words)
          content:
            application/json:
              schema:
                type: object
                required: [writing]
                properties:
                  writing:
                    type: object
                    nullable: true
                    required: [tone, foreword, chapters, writtenAt]
                    properties:
                      tone:
                        $ref: "#/components/schemas/BookTone"
                      foreword:
                        type: string
                      chapters:
                        type: object
                        additionalProperties:
                          type: string
                      writtenAt:
                        type: string

  /seasons/book/versions:
    get:
      summary: Every book made for a season, newest first; none is ever replaced
      operationId: listSeasonBooks
      tags: [Seasons]
      parameters:
        - name: season
          in: query
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Each version with a download link
          content:
            application/json:
              schema:
                type: object
                required: [versions]
                properties:
                  versions:
                    type: array
                    items:
                      type: object
                      required: [tone, madeAt, pages, writtenAt, url]
                      properties:
                        tone:
                          $ref: "#/components/schemas/BookTone"
                        madeAt:
                          type: string
                        pages:
                          type: integer
                        writtenAt:
                          type: string
                          nullable: true
                        url:
                          type: string

  /seasons/book:
    post:
      summary: A season as a print-ready 6 x 9 inch PDF, made once and kept until its answers change
      operationId: makeSeasonBook
      tags: [Seasons]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookRequest"
      responses:
        "200":
          description: A download link to the book
          content:
            application/json:
              schema:
                type: object
                required: [url, pages, tone, madeAt, made]
                properties:
                  url:
                    type: string
                  pages:
                    type: integer
                  tone:
                    $ref: "#/components/schemas/BookTone"
                  madeAt:
                    type: string
                  made:
                    type: boolean
                    description: False when the kept copy was still current
                  coverUrl:
                    type: string
                    description: The wraparound cover, sized for the book's page count
        "409":
          description: The book's writing hasn't been written yet (call /seasons/book/writing first)

  /seasons/review:
    get:
      summary: Look back on a season, the family's answers gathered to read together
      operationId: getSeasonReview
      tags: [Seasons]
      parameters:
        - name: season
          in: query
          required: false
          description: Season number; the latest that has started when left out
          schema:
            type: integer
      responses:
        "200":
          description: The season's numbers, the questions most of us answered, what we loved, everyone's season and the book
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeasonReview"
        "404":
          description: No such season, or none has started

  /family/memory:
    get:
      summary: Today's memory from the family's pages, one past question with everyone's answers
      operationId: getDailyMemory
      tags: [Family]
      parameters:
        - name: date
          in: query
          required: false
          description: The day (YYYY-MM-DD, Eastern); today when left out
          schema:
            type: string
      responses:
        "200":
          description: The memory, or null while there's nothing to bring back
          content:
            application/json:
              schema:
                type: object
                required: [memory]
                properties:
                  memory:
                    type: object
                    nullable: true
                    required: [date, asked, question, answers, kind]
                    properties:
                      date: { type: string }
                      asked: { type: string }
                      question: { type: string }
                      kind:
                        type: string
                        enum: [on-this-day, from-our-pages]
                      answers:
                        type: array
                        items:
                          type: object
                          required: [id, personId, answer]
                          properties:
                            id: { type: string }
                            personId: { type: string }
                            answer: { type: string }

  /family/person-book:
    post:
      summary: Someone's words (and, for someone the family has lost, the family's memories) as a print-ready book; kept, never replaced
      operationId: makePersonBook
      tags: [Family]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [personId]
              properties:
                personId:
                  type: string
                fresh:
                  type: boolean
      responses:
        "200":
          description: A download link to the book
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeptBook"
        "404":
          description: Unknown person, or nothing of theirs to print yet

  /family/person-book/versions:
    get:
      summary: Every book made of someone's words, newest first
      operationId: listPersonBooks
      tags: [Family]
      parameters:
        - name: personId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Each version with a download link
          content:
            application/json:
              schema:
                type: object
                required: [versions]
                properties:
                  versions:
                    type: array
                    items:
                      type: object
                      required: [madeAt, pages, url]
                      properties:
                        madeAt: { type: string }
                        pages: { type: integer }
                        url: { type: string }

  /family/person-story:
    get:
      summary: Someone's story, everything they told the family and what it loved most
      operationId: getPersonStory
      tags: [Family]
      parameters:
        - name: personId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Their words, oldest first, with the last few and the most loved picked out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonStory"
        "404":
          description: Not someone the family can see

  /family/words:
    get:
      summary: Someone's answers in their own words, newest first
      operationId: getFamilyWords
      tags: [Family]
      parameters:
        - name: personId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Up to 60 answers
          content:
            application/json:
              schema:
                type: object
                required: [personId, words]
                properties:
                  personId:
                    type: string
                  words:
                    type: array
                    items:
                      type: object
                      required: [question, answer, date]
                      properties:
                        question:
                          type: string
                        answer:
                          type: string
                        date:
                          type: string
                          nullable: true

  /graph:
    get:
      summary: The family as a graph — people with activity, ties, households, answered-alike pairs
      operationId: getFamilyGraph
      tags: [Family]
      responses:
        "200":
          description: Graph data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FamilyGraph"

  # ──────────────────────────────────────────────
  # Reactions (backend/features/reactions)
  # ──────────────────────────────────────────────

  /reactions:
    get:
      summary: Reactions on a batch of answers or facts, as the viewer sees them
      operationId: getReactions
      tags: [Reactions]
      parameters:
        - name: contentType
          in: query
          required: true
          schema:
            type: string
            enum: [fact, trivia]
        - name: ids
          in: query
          required: true
          description: Comma-separated content ids ("{ownerId}_{timestamp}"), at most 200
          schema:
            type: string
      responses:
        "200":
          description: Summary per id
          content:
            application/json:
              schema:
                type: object
                required: [reactions]
                properties:
                  reactions:
                    type: object
                    additionalProperties:
                      $ref: "#/components/schemas/ReactionSummary"
    put:
      summary: Set the viewer's reaction; the same one again, or null, takes it back
      operationId: putReaction
      tags: [Reactions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [contentType, contentId, reaction]
              properties:
                contentType:
                  type: string
                  enum: [fact, trivia]
                contentId:
                  type: string
                reaction:
                  type: string
                  enum: [love, laugh, same, wow, hug]
                  nullable: true
      responses:
        "200":
          description: The item's reactions after the change
          content:
            application/json:
              schema:
                type: object
                required: [contentId, summary]
                properties:
                  contentId:
                    type: string
                  summary:
                    $ref: "#/components/schemas/ReactionSummary"
        "400":
          description: Unknown reaction or content

  # ──────────────────────────────────────────────
  # Appearance (backend/features/appearance) — docs/decisions/0011
  # ──────────────────────────────────────────────

  /appearance:
    get:
      summary: The family's chosen theme (null for the default)
      operationId: getAppearance
      tags: [Appearance]
      responses:
        "200":
          description: Theme
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Appearance"

  /admin/appearance:
    put:
      summary: Choose the family's theme (admins)
      operationId: saveAppearance
      tags: [Appearance, Admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Appearance"
      responses:
        "200":
          description: Saved theme
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Appearance"
        "400":
          description: Unknown theme
        "403":
          description: Not an admin

  # ──────────────────────────────────────────────
  # Family archive (backend/features/archive)
  # ──────────────────────────────────────────────

  /archive/options:
    get:
      summary: Whether the viewer may export, and the people and homes to choose from
      operationId: getArchiveOptions
      tags: [Archive]
      responses:
        "200":
          description: Options
          content:
            application/json:
              schema:
                type: object
                required: [canExport, people, households]
                properties:
                  canExport:
                    type: boolean
                  people:
                    type: array
                    items:
                      type: object
                      required: [id, name, remembered]
                      properties:
                        id:
                          type: string
                        name:
                          type: string
                        remembered:
                          type: boolean
                  households:
                    type: array
                    items:
                      type: object
                      required: [id, name, members]
                      properties:
                        id:
                          type: string
                        name:
                          type: string
                        members:
                          type: array
                          items:
                            type: string

  /archive/export:
    post:
      summary: Build a zip of the chosen people's answers, facts, games and comments
      operationId: exportArchive
      tags: [Archive]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [people]
              properties:
                people:
                  oneOf:
                    - type: array
                      items:
                        type: string
                    - type: string
                      enum: [all]
      responses:
        "200":
          description: A short-lived download link
          content:
            application/json:
              schema:
                type: object
                required: [url, bytes, people]
                properties:
                  url:
                    type: string
                  bytes:
                    type: integer
                  people:
                    type: integer
        "400":
          description: Nobody chosen
        "403":
          description: Exporting is turned off for the viewer

  /admin/archive/permissions:
    get:
      summary: Who may export the family archive (admins)
      operationId: getArchivePermissions
      tags: [Archive, Admin]
      responses:
        "200":
          description: Permissions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExportPermissions"
    put:
      summary: Set who may export the family archive (admins)
      operationId: saveArchivePermissions
      tags: [Archive, Admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExportPermissions"
      responses:
        "200":
          description: Saved permissions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExportPermissions"

  # ──────────────────────────────────────────────
  # Settings (backend/features/settings) — docs/decisions/0013
  # ──────────────────────────────────────────────

  /settings/features:
    get:
      summary: Which optional parts of the app are on
      operationId: getFeatures
      tags: [Settings]
      responses:
        "200":
          description: Feature name to on/off
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: boolean

  /admin/settings:
    get:
      summary: Every setting with where its value comes from, the AI models, tasks and spend (admins)
      operationId: getAdminSettings
      tags: [Settings, Admin]
      parameters:
        - name: refreshModels
          in: query
          required: false
          description: "1 re-checks which models work"
          schema:
            type: string
      responses:
        "200":
          description: The admin view (shape in frontend/src/entities/settings)
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
    put:
      summary: Save settings (admins); null clears a value back to its default
      operationId: saveAdminSettings
      tags: [Settings, Admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [values]
              properties:
                values:
                  type: object
                  additionalProperties: true
      responses:
        "200":
          description: The admin view after saving
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400":
          description: A value didn't fit its setting

  # ──────────────────────────────────────────────
  # Filling in (backend/features/fill-in)
  # ──────────────────────────────────────────────

  /fill-in:
    get:
      summary: The caller's family questions to go back to, and how full their answers run
      operationId: getFillIn
      tags: [Facts]
      responses:
        "200":
          description: Every question with its state, the few most worth going back to, and a summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FillInView"
    put:
      summary: Answer a question the caller missed or skipped, or add to an answer (the earlier text is kept)
      operationId: putFillIn
      tags: [Facts]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key, answer]
              properties:
                key:
                  type: string
                  description: '"shared:YYYY-MM-DD" or "basic:N"'
                answer:
                  type: string
                  maxLength: 2000
      responses:
        "200":
          description: Saved, with the fun fact written from it
          content:
            application/json:
              schema:
                type: object
                required: [key, fact]
                properties:
                  key:
                    type: string
                  fact:
                    type: string
        "400":
          description: Empty or too long
        "404":
          description: Not one of the family's questions

  # ──────────────────────────────────────────────
  # Backups (backend/features/backups) — docs/decisions/0014
  # ──────────────────────────────────────────────

  /admin/backups:
    get:
      summary: The last backup, the copies kept, and whether nightly backups are on (admins)
      operationId: getBackups
      tags: [Admin]
      responses:
        "200":
          description: Backup status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupsView"
        "403":
          description: Not an admin
    post:
      summary: Make a full, checked copy of the family's data now (admins)
      operationId: makeBackup
      tags: [Admin]
      responses:
        "200":
          description: The copy that was made
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupRun"
        "403":
          description: Not an admin
        "503":
          description: The copy did not finish (the reason is in the error)

  # ──────────────────────────────────────────────
  # Knowledge index (backend/features/knowledge)
  # ──────────────────────────────────────────────

  /family/knowledge:
    get:
      summary: What the family shares, each person's top things and persona, and counted statistics
      operationId: getFamilyKnowledge
      tags: [Family]
      responses:
        "200":
          description: The family's knowledge view (shape in shared/src/knowledge.ts)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FamilyKnowledge"

  /me/knowledge:
    post:
      summary: Read my newest answers into the knowledge index (the app calls it after an answer)
      operationId: buildMyKnowledge
      tags: [Knowledge]
      responses:
        "200":
          description: How many answers were read, and whether the persona was rewritten
          content:
            application/json:
              schema:
                type: object
                required: [read, persona]
                properties:
                  read: { type: integer }
                  persona: { type: boolean }

  /admin/knowledge/build:
    post:
      summary: Read the next batch of new answers into the index and refresh personas (admins). Call again while left > 0.
      operationId: buildKnowledge
      tags: [Family, Admin]
      responses:
        "200":
          description: What this call did
          content:
            application/json:
              schema:
                type: object
                required: [read, personas, left, failures]
                properties:
                  read:
                    type: integer
                  personas:
                    type: integer
                  left:
                    type: integer
                  failures:
                    type: array
                    items:
                      type: string
        "403":
          description: Not an admin

components:
  schemas:
    GameId:
      type: string
      pattern: "^[a-z][a-z0-9-]{1,31}$"
      description: A game's folder name in frontend/src/games
      example: snake
    RoundStatus:
      type: object
      required: [canPlay, nextAvailable]
      properties:
        canPlay: { type: boolean }
        nextAvailable: { type: string, format: date-time, nullable: true }
    GameClue:
      type: object
      required: [clue, answer, from]
      properties:
        clue: { type: string }
        answer: { type: string, description: Uppercase letters only }
        from: { type: string, enum: [trivia, answers] }
        about: { type: string, description: "Whose answer it was, for clues from answers" }
    HighScoreEntry:
      type: object
      required: [userId, score, date, mode]
      properties:
        userId: { type: string }
        score: { type: number }
        date: { type: string, format: date-time }
        mode: { type: string, enum: [trivia, arcade] }
    ScoreSubmitResult:
      type: object
      required: [isNewHighScore, rank, previousBest, highScores]
      properties:
        isNewHighScore: { type: boolean }
        rank: { type: integer }
        previousBest: { type: number }
        highScores:
          type: array
          items: { $ref: "#/components/schemas/HighScoreEntry" }
    Circle:
      type: object
      required: [id, name, kind]
      properties:
        id:
          type: string
        name:
          type: string
        kind:
          type: string
          enum: [family, friends, mixed]
        root:
          type: boolean
        createdAt:
          type: string
        sources:
          type: array
          items: { type: string }
          description: "A joined circle (docs/decisions/0018): the circles it joins, whose people it reads"
        endedAt:
          type: string
          description: Set when a joined circle has been split
        pausedSeason:
          type: integer
          description: The season a split paused, opened again when joined again
    Session:
      type: object
      required: [token, userId, circleId, circles, email, isNewLink]
      properties:
        token:
          type: string
        userId:
          type: string
        circleId:
          type: string
        circles:
          type: array
          items:
            $ref: "#/components/schemas/MyCircle"
        email:
          type: string
        name:
          type: string
        picture:
          type: string
        isNewLink:
          type: boolean
    Invite:
      type: object
      description: shared/src/invite.ts
      required: [token, circleIds, for, createdBy, createdAt, expiresAt, maxUses, uses, approval]
      properties:
        token:
          type: string
        circleIds:
          type: array
          items:
            type: string
        for:
          type: object
          required: [kind]
          properties:
            kind:
              type: string
              enum: [anyone, person]
            userId:
              type: string
        createdBy:
          type: string
        createdAt:
          type: string
        expiresAt:
          type: string
          nullable: true
        maxUses:
          type: integer
          nullable: true
        uses:
          type: integer
        approval:
          type: boolean
        revokedAt:
          type: string
    InvitePreview:
      type: object
      required: [state]
      properties:
        state:
          type: string
          enum: [open, expired, used-up, revoked]
        circle:
          type: object
          properties:
            name:
              type: string
            kind:
              type: string
              enum: [family, friends, mixed]
        forName:
          type: string
        approval:
          type: boolean
    JoinDetails:
      type: object
      required: [name]
      properties:
        name:
          type: string
        howWeMet:
          type: string
    AvatarChoice:
      description: A picture the AI made for this person (key in their media), or a bundled animal on a color
      oneOf:
        - type: object
          required: [library, key]
          properties:
            library: { type: string, enum: [ai] }
            key: { type: string, description: "media/avatars/{userId}/{uuid}.jpg" }
        - type: object
          required: [library, animal, color]
          properties:
            library: { type: string, enum: [animal] }
            animal: { type: string }
            color: { type: string, enum: [sky, lilac, periwinkle, blush, peach, mint] }

    AfterPlan:
      type: object
      required: [drop, who, memories]
      properties:
        drop: { $ref: "#/components/schemas/Drop" }
        who: { type: array, items: { type: string } }
        memories:
          type: array
          items:
            type: object
            required: [by, text, at]
            properties:
              by: { type: string }
              text: { type: string }
              at: { type: string }

    Drop:
      type: object
      required: [id, by, kind, title, start, createdAt]
      properties:
        id: { type: string }
        by: { type: string }
        kind: { type: string, enum: [busy, free, plan] }
        title: { type: string }
        start: { type: string, description: YYYY-MM-DD }
        end: { type: string }
        part: { type: string, enum: [morning, afternoon, evening, all-day] }
        weekly:
          type: object
          properties:
            until: { type: string }
        said: { type: string }
        createdAt: { type: string }

    PlansView:
      type: object
      required: [days, drops, rsvps, best]
      properties:
        days:
          type: array
          items:
            type: object
            required: [date, busy, free, plans]
            properties:
              date: { type: string }
              busy: { type: array, items: { type: string } }
              free: { type: array, items: { type: string } }
              plans: { type: array, items: { type: string } }
        drops:
          type: array
          items:
            $ref: "#/components/schemas/Drop"
        rsvps:
          type: object
          additionalProperties:
            type: object
            additionalProperties:
              type: string
              enum: [in, out]
        best:
          type: array
          items: { type: string }

    MemoryLink:
      type: object
      required: [token, circleId, personId, createdBy, createdAt, expiresAt, uses]
      properties:
        token: { type: string }
        circleId: { type: string }
        personId: { type: string }
        createdBy: { type: string }
        createdAt: { type: string }
        expiresAt: { type: string, nullable: true }
        revokedAt: { type: string }
        uses: { type: integer }

    VisitorMemory:
      type: object
      required: [id, name, text, at, status]
      properties:
        id: { type: string }
        name: { type: string }
        how: { type: string }
        text: { type: string }
        at: { type: string }
        status: { type: string, enum: [waiting, shown] }

    MemoryLinkPreview:
      type: object
      required: [state]
      properties:
        state: { type: string, enum: [open, expired, used-up, revoked] }
        person:
          type: object
          required: [name]
          properties:
            name: { type: string }
            years: { type: string }
            dedication: { type: string }
        circle:
          type: object
          required: [name, kind]
          properties:
            name: { type: string }
            kind: { type: string, enum: [family, friends, mixed] }
        memories:
          type: array
          items:
            type: object
            required: [name, text, at]
            properties:
              name: { type: string }
              how: { type: string }
              text: { type: string }
              at: { type: string }

    Team:
      type: object
      required: [id, name, members, createdAt]
      properties:
        id: { type: string }
        name: { type: string }
        members: { type: array, items: { type: string } }
        createdAt: { type: string }

    TeamRequest:
      type: object
      required: [id, kind, from, at]
      properties:
        id: { type: string }
        kind: { type: string, enum: [join, team-up] }
        from: { type: string }
        teamId: { type: string }
        to: { type: string }
        at: { type: string }

    TeamsView:
      type: object
      required: [on, teams, myTeam, toMe, fromMe, standings]
      properties:
        on: { type: boolean, description: Whether this season is played in teams }
        teams: { type: array, items: { $ref: "#/components/schemas/Team" } }
        myTeam: { type: string, nullable: true }
        toMe: { type: array, items: { $ref: "#/components/schemas/TeamRequest" } }
        fromMe: { type: array, items: { $ref: "#/components/schemas/TeamRequest" } }
        standings:
          type: array
          items:
            type: object
            required: [teamId, name, members, average, total]
            properties:
              teamId: { type: string }
              name: { type: string }
              members: { type: array, items: { type: string } }
              average: { type: number, description: Points per member }
              total: { type: number }

    PersonIn:
      type: object
      description: One person as a source circle knows them
      required: [circleId, id]
      properties:
        circleId: { type: string }
        id: { type: string }
    SharedFrom:
      type: object
      description: "A circle someone's past answers could show from, in a joined circle (docs/decisions/0018)"
      required: [circleId, name, kind, shared]
      properties:
        circleId: { type: string }
        name: { type: string }
        kind: { type: string, enum: [family, friends, mixed] }
        shared: { type: boolean }
    SameSuggestion:
      type: object
      required: [a, b]
      properties:
        a:
          allOf:
            - $ref: "#/components/schemas/PersonIn"
            - type: object
              required: [name, circleName]
              properties: { name: { type: string }, circleName: { type: string } }
        b:
          allOf:
            - $ref: "#/components/schemas/PersonIn"
            - type: object
              required: [name, circleName]
              properties: { name: { type: string }, circleName: { type: string } }
    LifeEvent:
      type: object
      description: "A moment in someone's life one of their circles knows (docs/decisions/0018)"
      required: [date, kind, title, circleId]
      properties:
        date: { type: string, description: "YYYY, YYYY-MM or YYYY-MM-DD" }
        kind: { type: string, enum: [born, met, partner, parent, remembered, joined, plan] }
        title: { type: string }
        detail: { type: string }
        circleId: { type: string }
    WorldView:
      type: object
      required: [circles, enough, nodes, links, threads, meet, timeline]
      properties:
        timeline:
          type: array
          description: The viewer's life as their circles saw it, oldest first
          items: { $ref: "#/components/schemas/LifeEvent" }
        circles:
          type: array
          items:
            type: object
            required: [id, name, kind]
            properties:
              id: { type: string }
              name: { type: string }
              kind: { type: string, enum: [family, friends, mixed] }
        enough: { type: boolean }
        nodes:
          type: array
          items:
            type: object
            required: [id, circleId, personId, name]
            properties:
              id: { type: string }
              circleId: { type: string }
              personId: { type: string }
              name: { type: string }
              me: { type: boolean }
              bridge: { type: boolean }
        links:
          type: array
          items:
            type: object
            required: [a, b, kind]
            properties:
              a: { type: string }
              b: { type: string }
              kind: { type: string, enum: [tie, same] }
        threads:
          type: array
          items:
            type: object
            required: [name, kind, people]
            properties:
              name: { type: string }
              kind: { type: string }
              people: { type: array, items: { type: string } }
        meet:
          type: array
          items:
            type: object
            required: [a, b, because]
            properties:
              a: { type: string }
              b: { type: string }
              because: { type: string }

    ThreadChoice:
      type: object
      required: [id, label]
      properties:
        id:
          type: string
        label:
          type: string
        asksWhen:
          type: boolean

    ThreadQuestion:
      type: object
      required: [about, prompt, choices]
      properties:
        about:
          type: object
          required: [id, name]
          properties:
            id:
              type: string
            name:
              type: string
        prompt:
          type: string
        choices:
          type: array
          items:
            $ref: "#/components/schemas/ThreadChoice"

    ThreadProgress:
      type: object
      required: [tied, pairs]
      properties:
        tied:
          type: integer
        pairs:
          type: integer

    ThreadsToday:
      type: object
      required: [question, progress]
      properties:
        question:
          type: object
          nullable: true
          allOf:
            - $ref: "#/components/schemas/ThreadQuestion"
        progress:
          $ref: "#/components/schemas/ThreadProgress"

    ThreadAnswer:
      type: object
      required: [about, choice]
      properties:
        about:
          type: string
        choice:
          type: string
        when:
          type: string
          pattern: "^[0-9]{4}$"

    PendingJoin:
      type: object
      required: [id, token, email, details, requestedAt]
      properties:
        id:
          type: string
        token:
          type: string
        email:
          type: string
        details:
          $ref: "#/components/schemas/JoinDetails"
        requestedAt:
          type: string
    MyCircle:
      type: object
      description: A circle as one signed-in person sees it (shared/src/circle.ts)
      required: [id, name, kind, userId]
      properties:
        id:
          type: string
        name:
          type: string
        kind:
          type: string
          enum: [family, friends, mixed]
        userId:
          type: string
          description: Who this person is in that circle
        sources:
          type: array
          items: { type: string }
          description: "A joined circle (docs/decisions/0018): the circles it joins, whose people it reads"
        endedAt:
          type: string
          description: Set when a joined circle has been split
    # ──────────────────────────────────────────────
    # Reusable Schemas
    # ──────────────────────────────────────────────

    PlayEligibility:
      type: object
      required: [canPlay, todayET, catchupAvailable]
      description: Result of a play-eligibility check — single source of truth for "can this user play?"
      properties:
        canPlay:
          type: boolean
        reason:
          type: string
          enum: [daily_limit_reached, no_catchup_available, end_of_season]
          description: Why the user cannot play (only present when canPlay is false)
        nextAvailableAt:
          type: string
          format: date-time
          nullable: true
          description: ISO timestamp of when the user can next play
        todayET:
          type: string
          description: "Today's date in Eastern Time (YYYY-MM-DD)"
        catchupAvailable:
          type: integer
          description: Number of catch-up questions available
        lastAnsweredAt:
          type: string
          format: date-time
          nullable: true
          description: "ISO timestamp of the user's most recent answer"

    DifficultyLevel:
      type: string
      enum: [easy, normal, hard]

    GenerateMode:
      type: string
      enum: [personal, history, group, category, custom]

    Question:
      type: object
      required: [question, choices, answer]
      properties:
        question:
          type: string
        choices:
          type: array
          items:
            type: string
        answer:
          type: string
        category:
          type: string
        difficulty:
          $ref: "#/components/schemas/DifficultyLevel"
        pointMultiplier:
          type: number
        mode:
          type: string
        type:
          type: string
        source:
          type: string
        sourceUrl:
          type: string
        externalId:
          type: string

    ProgressMessage:
      type: object
      required: [type, message, timestamp]
      properties:
        type:
          type: string
          enum: [info, warning, success, checking]
        message:
          type: string
        timestamp:
          type: number
        detail:
          type: string
        duration:
          type: number

    HistoryEntry:
      type: object
      required: [question, selectedAnswer, correct, timestamp]
      properties:
        question:
          $ref: "#/components/schemas/Question"
        selectedAnswer:
          type: string
        correct:
          type: boolean
        timestamp:
          type: string
        pointsEarned:
          type: number
        streak:
          type: integer
        isCatchingUp:
          type: boolean
        isCasinoRush:
          type: boolean
        questionNumber:
          type: integer
