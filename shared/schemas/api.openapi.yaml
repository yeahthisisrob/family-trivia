            application/json:
              schema:
                type: object

  /admin/trivia-bank/browse:
    get:
      summary: Admin — browse trivia bank with filters
      operationId: adminTriviaBankBrowse
      tags: [Admin]
      parameters:
        - { name: adminUserId, in: query, required: true, schema: { type: string } }
