      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [adminUserId]
              properties:
                adminUserId:
                  type: string
                userId:
                  type: string
                mode:
                  type: string
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean

  /admin/daily-questions:
    get:
      summary: Admin — browse daily shared questions
      operationId: adminGetDailyQuestions
      tags: [Admin]
      parameters:
        - { name: adminUserId, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: List of shared questions
          content:
            application/json:
              schema:
                type: object
    delete:
      summary: Admin — delete a daily shared question
      operationId: adminDeleteDailyQuestion
      tags: [Admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [adminUserId, date]
              properties:
                adminUserId:
                  type: string
                date:
                  type: string
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean

  # ──────────────────────────────────────────────
  # Admin — trivia bank
  # ──────────────────────────────────────────────

  /admin/trivia-bank/stats:
    get:
      summary: Admin — trivia bank statistics
      operationId: adminTriviaBankStats
      tags: [Admin]
      parameters:
        - { name: adminUserId, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: Count by category/difficulty
