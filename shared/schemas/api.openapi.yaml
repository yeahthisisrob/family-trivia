                  $ref: "#/components/schemas/Season"
    post:
      summary: Create a season
      operationId: createAdminSeason
      tags: [Admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Season"
      responses:
        "200":
          description: Created season
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Season"
    put:
      summary: Update a season
      operationId: updateAdminSeason
      tags: [Admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Season"
      responses:
        "200":
          description: Updated season
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Season"
    delete:
      summary: Delete a season
      operationId: deleteAdminSeason
      tags: [Admin]
