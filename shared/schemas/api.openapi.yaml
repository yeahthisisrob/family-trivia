      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId]
              properties:
                userId:
                  type: string
      responses:
        "200":
          description: Crossword puzzle data
          content:
            application/json:
              schema:
                type: object
                properties:
                  grid:
                    type: array
                    items:
                      type: array
                      items:
                        type: string
                  clues:
                    type: array
                    items:
                      type: object
                      properties:
                        number:
                          type: integer
                        direction:
                          type: string
                          enum: [across, down]
                        clue:
                          type: string
                        answer:
                          type: string

