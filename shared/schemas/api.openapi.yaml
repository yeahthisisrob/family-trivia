  # ──────────────────────────────────────────────
  # Authentication
  # ──────────────────────────────────────────────

  /auth/google:
    post:
      summary: Sign in with Google; a passphrase joins one more circle
      operationId: authGoogle
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [googleIdToken]
              properties:
                googleIdToken:
                  type: string
                passphrase:
                  type: string
                  description: Links this Google account to the person it names, in its circle
                circleId:
                  type: string
                  description: The circle to open, if they're in it
      responses:
        "200":
          description: Session token, and the circles this sign-in belongs to
          content:
            application/json:
              schema:
                type: object
                required: [token, userId, circleId, circles, email, isNewLink]
                properties:
                  token:
                    type: string
                  userId:
                    type: string
                    description: Who they are in the circle being opened
                  circleId:
                    type: string
                  circles:
                    type: array
                    items:
                      $ref: "#/components/schemas/MyCircle"
                  email:
                    type: string
                  name:
                    type: string
                  picture:
                    type: string
                  isNewLink:
                    type: boolean
        "401":
          description: Bad Google token, unknown passphrase, or not linked yet (NOT_LINKED)
        "409":
          description: Person already linked elsewhere, or passphrase shared by two circles

  /me/circles:
    get:
      summary: Every circle the caller belongs to, and which one this request is in
      operationId: getMyCircles
      tags: [Circles]
      responses:
        "200":
          description: The caller's circles
          content:
            application/json:
              schema:
                type: object
                required: [circles, current]
                properties:
                  circles:
                    type: array
                    items:
                      $ref: "#/components/schemas/MyCircle"
                  current:
                    type: string
    post:
      summary: Join one more circle with a passphrase while signed in
      operationId: joinCircle
      tags: [Circles]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [passphrase]
              properties:
                passphrase:
                  type: string
      responses:
        "200":
          description: The caller's circles, with the one just joined
          content:
            application/json:
              schema:
                type: object
                required: [circles, joined, userId]
                properties:
                  circles:
                    type: array
                    items:
                      $ref: "#/components/schemas/MyCircle"
                  joined:
                    type: string
                  userId:
                    type: string
        "409":
          description: Person already linked elsewhere, or passphrase shared by two circles
        "422":
          description: The passphrase didn't match anyone (INVALID_PASSPHRASE)

  /admin/circles:
    get:
      summary: Every circle, for the deployment's owner (an admin of the founding circle)
      operationId: getCircles
      tags: [Circles]
      responses:
        "200":
          description: Whether the caller is the owner, and (if so) every circle
          content:
            application/json:
              schema:
                type: object
                required: [owner, circles]
                properties:
                  owner:
                    type: boolean
                  circles:
                    type: array
                    items:
                      $ref: "#/components/schemas/Circle"
    post:
      summary: Start a circle with the owner as its first admin
      operationId: createCircle
      tags: [Circles]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, kind, yourName]
              properties:
                name:
                  type: string
                kind:
                  type: string
                  enum: [family, friends, mixed]
                themeId:
                  type: string
                yourName:
                  type: string
                  description: What the new circle calls its maker
      responses:
        "200":
          description: The new circle, and every circle the owner is in now
          content:
            application/json:
              schema:
                type: object
                required: [circle, circles]
                properties:
                  circle:
                    $ref: "#/components/schemas/Circle"
                  circles:
                    type: array
                    items:
                      $ref: "#/components/schemas/MyCircle"
        "403":
          description: Not the owner

  /admin/circles/join:
    post:
      summary: "Join circles into one (docs/decisions/0018): its people are read from them, nothing is copied. The same circles joined again pick up the circle they had."
      operationId: joinCircles
      tags: [Circles]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sources]
              properties:
                name: { type: string, description: "Defaults to the circles' names together" }
                sources: { type: array, minItems: 2, items: { type: string } }
                themeId: { type: string }
      responses:
        "200":
          description: The joined circle, and the caller's circles after it
          content:
            application/json:
              schema:
                type: object
                required: [circle, again, circles]
                properties:
                  circle: { $ref: "#/components/schemas/Circle" }
                  again: { type: boolean, description: Joined before and split; picked up again }
                  circles: { type: array, items: { $ref: "#/components/schemas/MyCircle" } }
        "400": { description: "Fewer than two circles, or a joined one among them" }
        "403": { description: Not an admin in every circle joined }
        "409": { description: These circles are joined already }

  /me/sharing:
    get:
      summary: "In a joined circle: each circle the caller's past answers could come from, and whether they show here (on by default only from a family circle)"
      operationId: getSharing
      tags: [Circles]
      responses:
        "200":
          description: The circles, empty outside a joined circle
          content:
            application/json:
              schema:
                type: object
                required: [from]
                properties:
                  from: { type: array, items: { $ref: "#/components/schemas/SharedFrom" } }
    put:
      summary: Show the caller's past answers from one of their circles in this joined circle, or keep them out. Nothing is copied; the answers stay where they were given.
      operationId: setSharing
      tags: [Circles]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [circleId, shared]
              properties:
                circleId: { type: string }
                shared: { type: boolean }
      responses:
        "200":
          description: The circles, after the change
          content:
            application/json:
              schema:
                type: object
                required: [from]
                properties:
                  from: { type: array, items: { $ref: "#/components/schemas/SharedFrom" } }
        "400": { description: "Not a joined circle, or a missing field" }
        "404": { description: "Not one of the caller's circles here" }

  /admin/circles/same:
    get:
      summary: "In a joined circle: people who might be one person (the same name in two circles, not both signed in), for an admin to answer"
      operationId: getSamePeople
      tags: [Circles]
      parameters:
        - { name: circleId, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: The suggestions
          content:
            application/json:
              schema:
                type: object
                required: [suggestions]
                properties:
                  suggestions: { type: array, items: { $ref: "#/components/schemas/SameSuggestion" } }
        "400": { description: Not a joined circle }
        "403": { description: Not an admin there }
    post:
      summary: Answer one suggestion. The same person becomes one in the joined circle; not the same is never asked again. The source circles are untouched.
      operationId: answerSamePeople
      tags: [Circles]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [circleId, a, b, same]
              properties:
                circleId: { type: string }
                a: { $ref: "#/components/schemas/PersonIn" }
                b: { $ref: "#/components/schemas/PersonIn" }
                same: { type: boolean }
      responses:
        "200":
          description: The suggestions left
          content:
            application/json:
              schema:
                type: object
                required: [suggestions]
                properties:
                  suggestions: { type: array, items: { $ref: "#/components/schemas/SameSuggestion" } }
        "409": { description: Not a pair that was suggested }

  /admin/circles/split:
    post:
      summary: End a joined circle. Nothing is deleted; its season pauses and the circles it joined carry on.
      operationId: splitCircle
      tags: [Circles]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [circleId]
              properties:
                circleId: { type: string }
      responses:
        "200":
          description: The ended circle, and the caller's circles after it
          content:
            application/json:
              schema:
                type: object
                required: [circle, circles]
                properties:
                  circle: { $ref: "#/components/schemas/Circle" }
                  circles: { type: array, items: { $ref: "#/components/schemas/MyCircle" } }
        "400": { description: Not a joined circle }
        "403": { description: Not an admin there }

  /me/avatar:
    put:
      summary: Choose your picture (one made for you, or an animal), or null for initials
      operationId: putMyAvatar
      tags: [Avatar]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [avatar]
              properties:
                avatar:
                  type: object
                  nullable: true
                  allOf:
                    - $ref: "#/components/schemas/AvatarChoice"
      responses:
        "200":
          description: The saved choice
        "400":
          description: Not one of the library's pictures
        "404":
          description: Not in this circle's people yet

  /me/avatar/make:
    post:
      summary: Make a picture for me with AI, from what I love or a few words (a few a day); not used until chosen
      operationId: makeMyPicture
      tags: [Avatar]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                hint: { type: string, maxLength: 160 }
      responses:
        "200":
          description: The picture, a short-lived link to it, and how many more today
          content:
            application/json:
              schema:
                type: object
                required: [key, url, left]
                properties:
                  key: { type: string }
                  url: { type: string }
                  left: { type: integer }
        "429": { description: That's today's pictures }
        "502": { description: The picture didn't come out }

  /setup:
    get:
      summary: Whether this deployment still needs its first circle (before sign-in)
      operationId: getSetup
      tags: [Circles]
      responses:
        "200":
          description: The state
          content:
            application/json:
              schema:
                type: object
                required: [unstarted]
                properties:
                  unstarted: { type: boolean }

  /auth/start:
    post:
      summary: The first sign-in on a brand-new deployment starts its first circle, as owner
      operationId: startFirstCircle
      tags: [Circles, Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [googleIdToken, name, circle]
              properties:
                googleIdToken: { type: string }
                name: { type: string, description: What the circle calls them }
                circle:
                  type: object
                  required: [name, kind]
                  properties:
                    name: { type: string }
                    kind: { type: string, enum: [family, friends, mixed] }
                    themeId: { type: string }
      responses:
        "200":
          description: Signed in to the new circle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401": { description: Bad Google token }
        "403": { description: Not the configured owner }
        "409": { description: Already started }

  /plans:
    get:
      summary: The weeks ahead for the caller — who's away, who's free, plans and who's in, the best days
      operationId: getPlans
      tags: [Plans]
      responses:
        "200":
          description: Eight weeks from today
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlansView"
    post:
      summary: Drop in what you're doing, in your own words; the AI reads it into days
      operationId: dropInPlan
      tags: [Plans]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string, maxLength: 400 }
      responses:
        "200":
          description: What was added (empty when no day was found in the words)
          content:
            application/json:
              schema:
                type: object
                required: [added]
                properties:
                  added:
                    type: array
                    items:
                      $ref: "#/components/schemas/Drop"

  /plans/after:
    get:
      summary: Plans from the last two weeks the caller was in, asking how they went
      operationId: getAfterPlans
      tags: [Plans]
      responses:
        "200":
          description: The plans and their memories
          content:
            application/json:
              schema:
                type: object
                required: [plans]
                properties:
                  plans: { type: array, items: { $ref: "#/components/schemas/AfterPlan" } }

  /plans/memory:
    post:
      summary: Add a memory to a plan you were in ({ id, text }), or stop being asked ({ id, skip })
      operationId: rememberPlan
      tags: [Plans]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id: { type: string }
                text: { type: string, maxLength: 1000 }
                skip: { type: boolean }
      responses:
        "200":
          description: The plans after it
          content:
            application/json:
              schema:
                type: object
                required: [plans]
                properties:
                  plans: { type: array, items: { $ref: "#/components/schemas/AfterPlan" } }
        "404": { description: Not a plan you were in }

  /plans/remove:
    post:
      summary: Take back one of your own drops
      operationId: removePlan
      tags: [Plans]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id: { type: string }
      responses:
        "200": { description: Removed }
        "404": { description: Not one of yours }

  /plans/rsvp:
    post:
      summary: I'm in, or I can't, for someone's plan or free day (null takes it back)
      operationId: rsvpPlan
      tags: [Plans]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, answer]
              properties:
                id: { type: string }
                answer:
                  type: string
                  nullable: true
                  enum: [in, out, null]
      responses:
        "200": { description: Saved }
        "404": { description: No such plan }

  /remember:
    get:
      summary: A memory link's page, before sign-in — who it remembers and the memories let in, nothing else
      operationId: getRemember
      tags: [Memory links]
      parameters:
        - { name: token, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: The link's state and, while open, the person
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoryLinkPreview"
        "404": { description: No such link }
    post:
      summary: Add a memory through a link (no account); it waits for an admin
      operationId: postRemember
      tags: [Memory links]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, name, text]
              properties:
                token: { type: string }
                name: { type: string, maxLength: 60 }
                how: { type: string, maxLength: 120 }
                text: { type: string, maxLength: 2000 }
      responses:
        "200": { description: Waiting for an admin }
        "404": { description: No such link }
        "410": { description: The link has closed }
        "429": { description: Too many waiting }

  /family/visitor-memories:
    get:
      summary: Memories from outside the circle for someone remembered; admins also get the waiting ones
      operationId: getVisitorMemories
      tags: [Memory links]
      parameters:
        - { name: personId, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: The memories
          content:
            application/json:
              schema:
                type: object
                required: [memories]
                properties:
                  memories:
                    type: array
                    items:
                      $ref: "#/components/schemas/VisitorMemory"

  /admin/memory-links:
    get:
      summary: This person's memory links in this circle
      operationId: getMemoryLinks
      tags: [Memory links, Admin]
      parameters:
        - { name: personId, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: The links
          content:
            application/json:
              schema:
                type: object
                required: [links]
                properties:
                  links:
                    type: array
                    items:
                      $ref: "#/components/schemas/MemoryLink"
    post:
      summary: Make a memory link for someone the circle remembers
      operationId: postMemoryLink
      tags: [Memory links, Admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [personId]
              properties:
                personId: { type: string }
                lifetime: { type: string, enum: [day, week, month, forever] }
      responses:
        "200":
          description: The link
          content:
            application/json:
              schema:
                type: object
                required: [link]
                properties:
                  link:
                    $ref: "#/components/schemas/MemoryLink"
        "400": { description: Not someone the circle remembers }

  /admin/memory-links/revoke:
    post:
      summary: Take back a memory link
      operationId: revokeMemoryLink
      tags: [Memory links, Admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        "200": { description: Taken back }
        "404": { description: No such link }

  /admin/visitor-memories/decide:
    post:
      summary: Let a waiting memory in, or let it go
      operationId: decideVisitorMemory
      tags: [Memory links, Admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [personId, id, approve]
              properties:
                personId: { type: string }
                id: { type: string }
                approve: { type: boolean }
      responses:
        "200": { description: Decided }
        "404": { description: No such memory }

  /teams:
    get:
      summary: This season's teams as the caller sees them (requests to them, theirs, standings)
      operationId: getTeams
      tags: [Teams]
      responses:
        "200":
          description: The teams
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamsView"
    post:
      summary: Start a team (you're its first member)
      operationId: startTeam
      tags: [Teams]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 40 }
      responses:
        "200":
          description: The teams after it
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamsView"
        "409": { description: "Not a teams season, or already on a team" }

  /teams/ask:
    post:
      summary: Ask to join a team ({ teamId }), or ask someone on their own to team up ({ to })
      operationId: askTeam
      tags: [Teams]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object

              properties:
                teamId: { type: string }
                to: { type: string }
      responses:
        "200":
          description: The teams after it
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamsView"
        "409": { description: "Not now: not a teams season, already on a team, or the team is full" }

  /teams/answer:
    post:
      summary: Say yes or no to a request for your team or for you
      operationId: answerTeamRequest
      tags: [Teams]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requestId, accept]
              properties:
                requestId: { type: string }
                accept: { type: boolean }
      responses:
        "200":
          description: The teams after it
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamsView"
        "409": { description: "Not now: not a teams season, already on a team, or the team is full" }

  /teams/leave:
    post:
      summary: Leave your team (an empty team goes)
      operationId: leaveTeam
      tags: [Teams]
      responses:
        "200":
          description: The teams after it
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamsView"
        "409": { description: "Not now: not a teams season, already on a team, or the team is full" }

  /me/since:
    post:
      summary: What's new since the caller was last here (after a day and a half away; once per return), and note they're here now
      operationId: sinceLastVisit
      tags: [Notifications]
      responses:
        "200":
          description: The summary (since is null when there's nothing to say)
          content:
            application/json:
              schema:
                type: object
                required: [since, answeredBy, comments, reactions]
                properties:
                  since: { type: string, nullable: true }
                  answeredBy: { type: array, items: { type: string } }
                  comments: { type: integer }
                  reactions: { type: integer }

  /me/world:
    get:
      summary: Your world — one view across the caller's own circles, built for them alone and never stored
      operationId: getYourWorld
      tags: [Circles]
      responses:
        "200":
          description: The view (enough is false with fewer than two circles)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorldView"

  /threads/today:
    get:
      summary: Today's one "How do you know ...?" question (or none), and how many threads are tied
      operationId: getThreadsToday
      tags: [Threads]
      responses:
        "200":
          description: Today's question and the circle's progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThreadsToday"

  /threads/answer:
    post:
      summary: Answer it. The answer ties a thread between the two people, unless they're already connected.
      operationId: answerThread
      tags: [Threads]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ThreadAnswer"
      responses:
        "200":
          description: Whether a thread was tied, and the progress after
          content:
            application/json:
              schema:
                type: object
                required: [tied, progress]
                properties:
                  tied:
                    type: boolean
                  progress:
                    $ref: "#/components/schemas/ThreadProgress"
        "400":
          description: Unknown person or answer

  /invite:
    get:
      summary: What an invite link opens, shown before sign-in (only its own circle)
      operationId: getInvite
      tags: [Invites]
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The link's state and, while open, its circle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitePreview"
        "404":
          description: No such link

  /invite/accept:
    post:
      summary: Sign in with Google through an invite link and join its circle
      operationId: acceptInvite
      tags: [Invites]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, googleIdToken]
              properties:
                token:
                  type: string
                googleIdToken:
                  type: string
                details:
                  $ref: "#/components/schemas/JoinDetails"
      responses:
        "200":
          description: Joined (with a session), or waiting for an admin's yes
          content:
            application/json:
              schema:
                type: object
                required: [pending]
                properties:
                  pending:
                    type: boolean
                  circleName:
                    type: string
                  session:
                    description: Null while waiting, unless they're in other circles
                    type: object
                    nullable: true
                    allOf:
                      - $ref: "#/components/schemas/Session"
        "400":
          description: A link for anyone needs a name (NAME_REQUIRED)
        "409":
          description: That person is linked to another Google account
        "410":
          description: Expired, used up or taken back (INVITE_EXPIRED, INVITE_USED_UP, INVITE_REVOKED)

  /admin/invites:
    get:
      summary: This circle's invite links and the joins waiting for a yes
      operationId: getInvites
      tags: [Invites]
      responses:
        "200":
          description: Links (open, and ended in the last month) and waiting joins
          content:
            application/json:
              schema:
                type: object
                required: [invites, joins]
                properties:
                  invites:
                    type: array
                    items:
                      $ref: "#/components/schemas/Invite"
                  joins:
                    type: array
                    items:
                      $ref: "#/components/schemas/PendingJoin"
    post:
      summary: Make an invite link for this circle
      operationId: createInvite
      tags: [Invites]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                for:
                  type: object
                  description: Leave out for anyone; give userId for one person already added
                  properties:
                    userId:
                      type: string
                lifetime:
                  type: string
                  enum: [day, week, month, forever]
                maxUses:
                  type: integer
                  nullable: true
                approval:
                  type: boolean
      responses:
        "200":
          description: The new link
          content:
            application/json:
              schema:
                type: object
                required: [invite]
                properties:
                  invite:
                    $ref: "#/components/schemas/Invite"

  /admin/invites/revoke:
    post:
      summary: Take an invite link back
      operationId: revokeInvite
      tags: [Invites]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
      responses:
        "200":
          description: Taken back
        "404":
          description: Not one of this circle's links

  /admin/joins/decide:
    post:
      summary: Let someone waiting in, or not
      operationId: decideJoin
      tags: [Invites]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, approve]
              properties:
                id:
                  type: string
                approve:
                  type: boolean
      responses:
        "200":
          description: Decided; userId is set when they were let in
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean
                  userId:
                    type: string

  # ──────────────────────────────────────────────
  # Notifications
  # ──────────────────────────────────────────────

  /notifications:
    get:
      summary: Get the user's notification summary
      operationId: getNotifications
      tags: [Notifications]
      parameters:
        - name: userId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Notifications bucket with unread count + recent items
          content:
            application/json:
              schema:
                type: object
                properties:
                  unreadCount:
                    type: integer
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        type:
                          type: string
                        timestamp:
                          type: string
                        read:
                          type: boolean
                        contentType:
                          type: string
                        contentId:
                          type: string
                        message:
                          type: string

  /notifications/mark-read:
    post:
      summary: Mark a notification as read
      operationId: markNotificationRead
      tags: [Notifications]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, notificationId]
              properties:
                userId:
                  type: string
                notificationId:
                  type: string
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean

  /notifications/mark-all-read:
    post:
      summary: Mark all notifications for a user as read
      operationId: markAllNotificationsRead
      tags: [Notifications]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId]
              properties:
                userId:
                  type: string
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean

  # ──────────────────────────────────────────────
  # Unified Comments (/comments)
  # ──────────────────────────────────────────────

  /comments:
    get:
      summary: Get the comment thread for a content item
      operationId: getCommentsUnified
      tags: [Comments]
      parameters:
        - name: contentType
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/CommentContentType"
        - name: contentId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The comment thread (empty when nobody has commented)
          content:
            application/json:
              schema:
                type: object
                required: [thread]
                properties:
                  thread:
                    $ref: "#/components/schemas/CommentThread"
    post:
      summary: Add a new comment to a content item
      operationId: addCommentUnified
      tags: [Comments]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [contentType, contentId, text]
              properties:
                contentType:
                  $ref: "#/components/schemas/CommentContentType"
                contentId:
                  type: string
                text:
                  type: string
                  maxLength: 2000
                parentId:
                  type: string
      responses:
        "201":
          description: The new comment, by the caller
          content:
            application/json:
              schema:
                type: object
                required: [comment, success]
                properties:
                  comment:
                    $ref: "#/components/schemas/Comment"
                  success:
                    type: boolean

  /comments/counts:
    get:
      summary: Get comment counts + recent commenters for multiple content items
      operationId: getCommentCountsUnified
      tags: [Comments]
      parameters:
        - name: contentType
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/CommentContentType"
        - name: ids
          in: query
          required: true
          description: Comma-separated list of content IDs
          schema:
            type: string
      responses:
        "200":
          description: Counts map + recent commenters map
          content:
            application/json:
              schema:
                type: object
                properties:
                  counts:
                    type: object
                    additionalProperties:
                      type: integer
                  commenters:
                    type: object
                    description: "Recent commenter userIds (up to 3) per content id"
                    additionalProperties:
                      type: array
                      items:
                        type: string

  # ──────────────────────────────────────────────
  # Fact Suggestions (autocomplete)
  # ──────────────────────────────────────────────

  /fact-suggestions:
    get:
      summary: Get common opening phrases for fact answer autocomplete
      operationId: getFactSuggestions
      tags: [Facts]
      responses:
        "200":
          description: List of common starter phrases extracted from family answers
          content:
            application/json:
              schema:
                type: object
                properties:
                  starters:
                    type: array
                    items:
                      type: string

  # ──────────────────────────────────────────────
  # Answer / Fact Grids
  # ──────────────────────────────────────────────

  /answer-grid:
    get:
      summary: "Trivia status grid: who answered which slot + correctness"
      operationId: getAnswerGrid
      tags: [Trivia]
      responses:
        "200":
          description: Matrix keyed by userId with slot status
          content:
            application/json:
              schema:
                type: object
                properties:
                  maxSlots:
                    type: integer
                  users:
                    type: array
                    items:
                      type: object
                      properties:
                        userId:
                          type: string
                        slots:
                          type: array
                          items:
                            type: object
                            properties:
                              correct:
                                type: boolean
                              isCatchingUp:
                                type: boolean
                              isGameMode:
                                type: boolean

  /fact-grid:
    get:
      summary: Daily fact status matrix
      operationId: getFactGrid
      tags: [Facts]
      responses:
        "200":
          description: Matrix of which days each user answered the daily fact
          content:
            application/json:
              schema:
                type: object
                properties:
                  dates:
                    type: array
                    items:
                      type: string
                  users:
                    type: array
                    items:
                      type: object
                      properties:
                        userId:
                          type: string
                        answered:
                          type: array
                          items:
                            type: boolean

  # ──────────────────────────────────────────────
  # Slot Machine variants
  # ──────────────────────────────────────────────

  /slot-machine/arcade-spin:
    post:
      summary: Spin the slot machine in arcade (non-daily) mode
      operationId: slotMachineArcadeSpin
      tags: [Game Modes]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, betPoints]
              properties:
                userId:
                  type: string
                betPoints:
                  type: integer
      responses:
        "200":
          description: Spin result
          content:
            application/json:
              schema:
                type: object
                properties:
                  outcome:
                    type: string
                  pointsWon:
                    type: integer
                  newBalance:
                    type: integer

  /slot-machine/balance:
    get:
      summary: Get the user's arcade slot machine point balance
      operationId: getSlotMachineBalance
      tags: [Game Modes]
      parameters:
        - name: userId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Current balance
          content:
            application/json:
              schema:
                type: object
                properties:
                  balance:
                    type: integer

  # ──────────────────────────────────────────────
  # Games (docs/decisions/0032): what every game gets, by id, with no
  # backend of its own. A game id is its folder in frontend/src/games.
  # ──────────────────────────────────────────────

  /games/scores:
    get:
      summary: A game's high scores, best first (trivia and arcade plays)
      operationId: getGameScores
      tags: [Games]
      parameters:
        - { name: game, in: query, required: true, schema: { $ref: "#/components/schemas/GameId" } }
      responses:
        "200":
          description: The top 20
          content:
            application/json:
              schema:
                type: object
                required: [game, scores]
                properties:
                  game: { $ref: "#/components/schemas/GameId" }
                  scores:
                    type: array
                    items: { $ref: "#/components/schemas/HighScoreEntry" }
        "400": { description: Not a game id }
    post:
      summary: Submit the caller's score; their best counts
      operationId: submitGameScore
      tags: [Games]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [game, score]
              properties:
                game: { $ref: "#/components/schemas/GameId" }
                score: { type: number, minimum: 0 }
      responses:
        "200":
          description: Whether it's a new best, and the board after it
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScoreSubmitResult" }
        "400": { description: "Not a game id, or not a score" }

  /games/save:
    get:
      summary: The caller's save for a game (progress, settings), or null
      operationId: getGameSave
      tags: [Games]
      parameters:
        - { name: game, in: query, required: true, schema: { $ref: "#/components/schemas/GameId" } }
      responses:
        "200":
          description: The save
          content:
            application/json:
              schema:
                type: object
                required: [game, save]
                properties:
                  game: { $ref: "#/components/schemas/GameId" }
                  save: { description: "Whatever the game saved, or null" }
    put:
      summary: Replace the caller's save for a game (at most 16,000 characters of JSON)
      operationId: putGameSave
      tags: [Games]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [game, save]
              properties:
                game: { $ref: "#/components/schemas/GameId" }
                save: { description: Any JSON value }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                type: object
                required: [game, save]
                properties:
                  game: { $ref: "#/components/schemas/GameId" }
                  save: {}
        "413": { description: Too big }

  /games/rounds:
    get:
      summary: "For each game asked about: can it be played as this week's round now, and if not, when"
      operationId: getGameRounds
      tags: [Games]
      parameters:
        - name: games
          in: query
          required: true
          description: Game ids, comma separated (up to 20)
          schema: { type: string, example: "tetris,curling" }
      responses:
        "200":
          description: Round status by game id
          content:
            application/json:
              schema:
                type: object
                required: [rounds]
                properties:
                  rounds:
                    type: object
                    additionalProperties: { $ref: "#/components/schemas/RoundStatus" }

  /games/rounds/lock:
    post:
      summary: The game is over; keep its multiplier (and score) and get the trivia question
      operationId: lockGameRound
      tags: [Games]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [game, multiplier]
              properties:
                game: { $ref: "#/components/schemas/GameId" }
                multiplier: { type: number, enum: [0.5, 1, 2, 3] }
                score: { type: number, minimum: 0, description: "The game's own score; goes on its board, and a new best adds a point" }
                catchUp: { type: boolean, description: Play it as a catch-up question }
      responses:
        "200":
          description: The question (without its answer)
          content:
            application/json:
              schema:
                type: object
                required: [multiplier, question, newBest]
                properties:
                  multiplier: { type: number }
                  newBest: { type: boolean }
                  question:
                    type: object
                    required: [question, choices, category]
                    properties:
                      question: { type: string }
                      choices: { type: array, items: { type: string } }
                      category: { type: string }
        "400": { description: "Not a game id, or a multiplier outside the rules" }
        "403": { description: "Not now: errorType is cooldown, daily_limit_reached, no_catchup_available, end_of_season or no_trivia_this_season; details is when it opens" }

  /games/rounds/answer:
    post:
      summary: Answer the round's question
      operationId: answerGameRound
      tags: [Games]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [game, answer]
              properties:
                game: { $ref: "#/components/schemas/GameId" }
                answer: { type: string }
      responses:
        "200":
          description: How it went
          content:
            application/json:
              schema:
                type: object
                required: [correct, correctAnswer, pointsEarned, multiplier, newBestBonus]
                properties:
                  correct: { type: boolean }
                  correctAnswer: { type: string }
                  pointsEarned: { type: number }
                  multiplier: { type: number }
                  newBestBonus: { type: number }
        "400": { description: No round for this game }

  /games/clues:
    get:
      summary: Clues with one-word answers, from the circle's trivia and its answers
      operationId: getGameClues
      tags: [Games]
      parameters:
        - { name: count, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
        - { name: minLength, in: query, schema: { type: integer, minimum: 2, maximum: 15, default: 3 } }
        - { name: maxLength, in: query, schema: { type: integer, minimum: 2, maximum: 15, default: 8 } }
      responses:
        "200":
          description: Shuffled clues
          content:
            application/json:
              schema:
                type: object
                required: [clues]
                properties:
                  clues:
                    type: array
                    items: { $ref: "#/components/schemas/GameClue" }

  # ──────────────────────────────────────────────
  # Crossword (builds its grid on the server)
  # ──────────────────────────────────────────────

  /crossword/generate:
    post:
