name: Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # mise installs the node/pnpm/gitleaks pinned in mise.toml, so CI runs
      # the same binaries as laptops. No `node-version:` here to drift.
      - uses: jdx/mise-action@v4
        with:
          version: 2026.9.2
          cache: true

      - run: pnpm install --frozen-lockfile

      - name: Format and lint
        run: pnpm exec biome ci .

      # LEAKGUARD_TERMS is an optional repo secret: your family's names, one per
      # line. Without it only the built-in patterns run.
      - name: Family privacy
        run: node scripts/leak-guard.mjs
        env:
          LEAKGUARD_TERMS: ${{ secrets.LEAKGUARD_TERMS }}

      # No slice imports another; each frontend layer imports only below it (0008).
      - name: Layout rules
        run: node scripts/check-architecture.mjs

      - name: Dead code
        run: pnpm exec knip --no-progress

      - name: Typecheck
        run: pnpm -r run typecheck

      - name: Test
        run: pnpm -r run test

      - name: Contract is current
        run: |
          pnpm --filter @family-trivia/shared run contract
          git diff --exit-code --stat shared/generated \
            || { echo "::error::shared/generated is stale: run 'just contract' and commit the result"; exit 1; }

      - name: README screenshots are current
        run: node scripts/check-screenshots.mjs

      - name: Build
        run: pnpm -r run build

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v4
        with:
          version: 2026.9.2
          cache: true
      - run: gitleaks git --no-banner --redact

  storybook:
    name: Storybook stories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          version: 2026.9.2
          cache: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @family-trivia/web exec playwright install --with-deps chromium
      - name: Story tests
        run: pnpm --filter @family-trivia/web run storybook:test

      # Every story rendered in dark mode; fails if a large element still
      # paints a light background (scripts/dark-audit.mjs).
      - name: Dark mode audit
        run: |
          pnpm --filter @family-trivia/web run build-storybook
          node scripts/dark-audit.mjs

      # Every README picture's story still exists in the built Storybook.
      - name: README stories exist
        run: node scripts/check-screenshots.mjs --stories
