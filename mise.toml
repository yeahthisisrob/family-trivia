# Host toolchain. `mise install` gives every contributor and CI the same
# binaries; mise.lock pins them by checksum per platform.
#
# node is the host twin of the Lambda runtime (Runtime.NODEJS_22_X in
# infra/lib/family-trivia-stack.ts), so what runs locally is what runs deployed.
#
# pnpm replaces npm: one lockfile and one store for the four workspace
# packages, so an install in one of them can't drift a dependency out from
# under the others. See docs/decisions/0002-toolchain.md.

[tools]
node = "22.23.4"
pnpm = "12.14.0"
just = "1.59.0"
lefthook = "2.2.2"
gitleaks = "8.30.1"

[settings]
lockfile = true
